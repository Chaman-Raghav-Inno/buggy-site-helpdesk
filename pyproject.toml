[project]
name = "buggy-site-helpdesk"
version = "0.1.0"
description = "Beacon Support: a demo customer-support helpdesk with planted functional bugs, for testing the AI QA Scanner"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"beacon/data.py" = ["E501"]  # seed conversations read better on one line each
