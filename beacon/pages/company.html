<h1 id="co-title">Company tickets</h1>
<p class="muted">Every ticket raised by you and your colleagues. As a company admin you can read and reply to all of them.</p>
<div class="tiles">
  <div class="tile"><p class="tile-label">Open</p><p class="tile-value" id="co-open">–</p></div>
  <div class="tile"><p class="tile-label">Waiting on your team</p><p class="tile-value" id="co-waiting">–</p></div>
  <div class="tile"><p class="tile-label">Solved this month</p><p class="tile-value" id="co-solved">–</p></div>
</div>
<div class="table-wrap">
  <table class="table tk-table" aria-label="Company tickets">
    <thead><tr><th>Ticket</th><th>Subject</th><th>Raised by</th><th>Status</th><th>Priority</th><th>Last updated</th></tr></thead>
    <tbody id="co-rows"></tbody>
  </table>
</div>
